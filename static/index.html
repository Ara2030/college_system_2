<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИС Колледжа • СПО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600">ИС Колледжа</h1>
            </div>
            <nav class="px-3">
                <a onclick="showSection('students')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1">
                    <i class="fas fa-users w-5"></i> <span>Студенты</span>
                </a>
                <a onclick="showSection('groups')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1">
                    <i class="fas fa-layer-group w-5"></i> <span>Группы</span>
                </a>
                <a onclick="showSection('employees')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1">
                    <i class="fas fa-user-tie w-5"></i> <span>Сотрудники</span>
                </a>
                <a onclick="showSection('orders')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1">
                    <i class="fas fa-file-alt w-5"></i> <span>Приказы</span>
                </a>
                <a onclick="showSection('subjects')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1">
                    <i class="fas fa-book w-5"></i> <span>Предметы</span>
                </a>
                <a onclick="showSection('journal')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-100 cursor-pointer mb-1 active">
                    <i class="fas fa-book-open w-5"></i> <span>Журнал оценок</span>
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="bg-white border-b px-8 py-5 flex justify-between items-center">
                <h2 id="pageTitle" class="text-2xl font-semibold">Журнал оценок</h2>
                <button onclick="openModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span id="addButtonText">Добавить оценку</span>
                </button>
            </div>

            <div class="p-8">
                <!-- Фильтры -->
                <div class="mb-4 flex gap-4">
                    <div class="w-64">
                        <select id="filterGroup" onchange="filterJournal()" class="w-full border px-4 py-2.5 rounded-xl">
                            <option value="">Все группы</option>
                        </select>
                    </div>
                    <div class="w-64">
                        <select id="filterSubject" onchange="filterJournal()" class="w-full border px-4 py-2.5 rounded-xl">
                            <option value="">Все предметы</option>
                        </select>
                    </div>
                </div>

                <!-- Таблица журнала -->
                <div id="journal" class="section">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-4 text-left">Студент</th>
                                    <th class="px-6 py-4 text-left">Предмет</th>
                                    <th class="px-6 py-4 text-left">Оценка</th>
                                    <th class="px-6 py-4 text-left">Дата</th>
                                    <th class="px-6 py-4 w-28 text-center">Действия</th>
                                </tr>
                            </thead>
                            <tbody id="journalTable" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="bg-white rounded-2xl w-full max-w-md mx-4 p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-semibold"></h3>
                <button onclick="closeModal()"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        const API = "http://127.0.0.1:8000";
        let students = [];
        let subjects = [];
        let attestations = [];
        let editId = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-xl shadow text-white flex items-center gap-3 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        async function loadJournalData() {
            const [sRes, subRes, attRes] = await Promise.all([
                fetch(`${API}/students/`),
                fetch(`${API}/subjects/`),
                fetch(`${API}/attestation/`)
            ]);
            students = await sRes.json();
            subjects = await subRes.json();
            attestations = await attRes.json();
        }

        function populateFilters() {
            // Группы
            const groupSelect = document.getElementById('filterGroup');
            groupSelect.innerHTML = '<option value="">Все группы</option>';
            const uniqueGroups = [...new Set(students.map(s => s.group_id).filter(Boolean))];
            uniqueGroups.forEach(gid => {
                const student = students.find(s => s.group_id === gid);
                const opt = document.createElement('option');
                opt.value = gid;
                opt.textContent = `Группа ${gid}`;
                groupSelect.appendChild(opt);
            });

            // Предметы
            const subjectSelect = document.getElementById('filterSubject');
            subjectSelect.innerHTML = '<option value="">Все предметы</option>';
            subjects.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.textContent = sub.name;
                subjectSelect.appendChild(opt);
            });
        }

        function filterJournal() {
            const groupFilter = document.getElementById('filterGroup').value;
            const subjectFilter = document.getElementById('filterSubject').value;

            let filtered = attestations;

            if (groupFilter) {
                const groupStudents = students.filter(s => s.group_id == groupFilter).map(s => s.id);
                filtered = filtered.filter(a => groupStudents.includes(a.student_id));
            }

            if (subjectFilter) {
                filtered = filtered.filter(a => a.subject_id == subjectFilter);
            }

            renderJournalTable(filtered);
        }

        function renderJournalTable(data) {
            const tbody = document.getElementById('journalTable');
            tbody.innerHTML = '';

            data.forEach(item => {
                const student = students.find(s => s.id === item.student_id);
                const subject = subjects.find(s => s.id === item.subject_id);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4">${student ? student.full_name : '—'}</td>
                    <td class="px-6 py-4">${subject ? subject.name : '—'}</td>
                    <td class="px-6 py-4 font-semibold">${item.grade || '—'}</td>
                    <td class="px-6 py-4">${item.date || '—'}</td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="editGrade(${item.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteGrade(${item.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function showSection(section) {
            if (section === 'journal') {
                document.getElementById('pageTitle').innerText = 'Журнал оценок';
                await loadJournalData();
                populateFilters();
                renderJournalTable(attestations);
            }
        }

        async function deleteGrade(id) {
            if (!confirm('Удалить оценку?')) return;
            await fetch(`${API}/attestation/${id}`, { method: 'DELETE' });
            showToast('Оценка удалена');
            await loadJournalData();
            filterJournal();
        }

        async function editGrade(id) {
            editId = id;
            const res = await fetch(`${API}/attestation/${id}`);
            const data = await res.json();
            openModal(true, data);
        }

        function openModal(isEdit = false, data = null) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');

            document.getElementById('modalTitle').innerText = isEdit ? 'Редактировать оценку' : 'Добавить оценку';

            let studentOptions = students.map(s => 
                `<option value="${s.id}">${s.full_name}</option>`
            ).join('');

            let subjectOptions = subjects.map(s => 
                `<option value="${s.id}">${s.name}</option>`
            ).join('');

            content.innerHTML = `
                <form id="gradeForm">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Студент</label>
                            <select id="student_id" class="w-full border px-4 py-2.5 rounded-xl" required>
                                <option value="">Выберите студента</option>
                                ${studentOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Предмет</label>
                            <select id="subject_id" class="w-full border px-4 py-2.5 rounded-xl" required>
                                <option value="">Выберите предмет</option>
                                ${subjectOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Оценка</label>
                            <input type="number" id="grade" value="${data?.grade || ''}" min="2" max="5" class="w-full border px-4 py-2.5 rounded-xl" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Дата</label>
                            <input type="date" id="date" value="${data?.date || ''}" class="w-full border px-4 py-2.5 rounded-xl">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium mt-2">
                            ${isEdit ? 'Сохранить' : 'Добавить оценку'}
                        </button>
                    </div>
                </form>
            `;

            // Заполняем значения при редактировании
            if (isEdit && data) {
                document.getElementById('student_id').value = data.student_id;
                document.getElementById('subject_id').value = data.subject_id;
            }

            document.getElementById('gradeForm').onsubmit = async (e) => {
                e.preventDefault();

                const payload = {
                    student_id: parseInt(document.getElementById('student_id').value),
                    subject_id: parseInt(document.getElementById('subject_id').value),
                    grade: parseInt(document.getElementById('grade').value),
                    date: document.getElementById('date').value || null
                };

                try {
                    if (editId) {
                        await fetch(`${API}/attestation/${editId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        showToast('Оценка обновлена');
                    } else {
                        await fetch(`${API}/attestation/`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        showToast('Оценка добавлена');
                    }
                    closeModal();
                    await loadJournalData();
                    filterJournal();
                } catch {
                    showToast('Ошибка при сохранении', 'error');
                }
            };
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            editId = null;
        }

        // Инициализация
        window.onload = async () => {
            await loadJournalData();
            showSection('journal');
        };
    </script>
</body>
</html>
