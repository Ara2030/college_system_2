<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИС Колледжа • СПО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600">ИС Колледжа</h1>
            </div>
            <nav class="px-3 text-sm">
                <a onclick="showSection('students')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-users w-5"></i> <span>Студенты</span></a>
                <a onclick="showSection('groups')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-layer-group w-5"></i> <span>Группы</span></a>
                <a onclick="showSection('employees')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-user-tie w-5"></i> <span>Сотрудники</span></a>
                <a onclick="showSection('orders')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-file-alt w-5"></i> <span>Приказы</span></a>
                <a onclick="showSection('subjects')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-book w-5"></i> <span>Предметы</span></a>
                <a onclick="showSection('journal')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-book-open w-5"></i> <span>Журнал оценок</span></a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="bg-white border-b px-8 py-5 flex justify-between items-center">
                <h2 id="pageTitle" class="text-2xl font-semibold">Студенты</h2>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span id="addButtonText">Добавить</span>
                </button>
            </div>

            <div class="p-8">
                <!-- Search -->
                <div class="mb-4">
                    <div class="relative w-80">
                        <input type="text" id="searchInput" placeholder="Поиск..." 
                               class="w-full border px-4 py-2.5 pl-10 rounded-xl"
                               onkeyup="filterAndRender()">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                    </div>
                </div>

                <!-- Tables -->
                <div id="students" class="section">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">ФИО</th>
                                <th class="px-6 py-4 text-left">Группа</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="studentsTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="studentsPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <div id="groups" class="section hidden">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">Название</th>
                                <th class="px-6 py-4 text-left">Специальность</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="groupsTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="groupsPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <div id="employees" class="section hidden">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">ФИО</th>
                                <th class="px-6 py-4 text-left">Должность</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="employeesTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="employeesPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <div id="orders" class="section hidden">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">Номер</th>
                                <th class="px-6 py-4 text-left">Дата</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="ordersTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="ordersPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <div id="subjects" class="section hidden">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">Название</th>
                                <th class="px-6 py-4 text-left">Часы</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="subjectsTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="subjectsPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <div id="journal" class="section hidden">
                    <div class="bg-white rounded-2xl shadow border overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-gray-50"><tr>
                                <th class="px-6 py-4 text-left">Студент</th>
                                <th class="px-6 py-4 text-left">Предмет</th>
                                <th class="px-6 py-4 text-left">Оценка</th>
                                <th class="px-6 py-4 text-left">Дата</th>
                                <th class="px-6 py-4 w-28 text-center">Действия</th>
                            </tr></thead>
                            <tbody id="journalTable" class="divide-y"></tbody>
                        </table>
                    </div>
                    <div id="journalPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="bg-white rounded-2xl w-full max-w-md mx-4 p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-semibold"></h3>
                <button onclick="closeModal()"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        const API = "http://127.0.0.1:8000";
        let currentSection = 'students';
        let editId = null;
        let allData = { students: [], groups: [], employees: [], orders: [], subjects: [], journal: [] };
        let currentPage = 1;
        const pageSize = 10;

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-xl shadow text-white flex items-center gap-3 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.3s';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
            document.getElementById(section).classList.remove('hidden');
            currentSection = section;
            currentPage = 1;
            editId = null;
            document.getElementById('searchInput').value = '';

            const titles = {
                students: 'Студенты', groups: 'Группы', employees: 'Сотрудники',
                orders: 'Приказы', subjects: 'Предметы', journal: 'Журнал оценок'
            };
            const addTexts = {
                students: 'Добавить студента', groups: 'Добавить группу', employees: 'Добавить сотрудника',
                orders: 'Добавить приказ', subjects: 'Добавить предмет', journal: 'Добавить оценку'
            };

            document.getElementById('pageTitle').innerText = titles[section];
            document.getElementById('addButtonText').innerText = addTexts[section];

            if (section === 'journal') {
                loadJournal();
            } else {
                loadData(section);
            }
        }

        async function loadData(section) {
            try {
                const res = await fetch(`${API}/${section}/`);
                if (!res.ok) throw new Error();
                allData[section] = await res.json();
                filterAndRender();
            } catch {
                showToast('Ошибка загрузки данных', 'error');
            }
        }

        async function loadJournal() {
            try {
                const [s, sub, att] = await Promise.all([
                    fetch(`${API}/students/`), fetch(`${API}/subjects/`), fetch(`${API}/attestation/`)
                ]);
                allData.students = await s.json();
                allData.subjects = await sub.json();
                allData.journal = await att.json();
                filterAndRender();
            } catch {
                showToast('Ошибка загрузки журнала', 'error');
            }
        }

        function getFilteredData(section) {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            let data = allData[section] || [];

            if (!search) return data;

            return data.filter(item => {
                if (section === 'students') return item.full_name?.toLowerCase().includes(search);
                if (section === 'groups') return item.name?.toLowerCase().includes(search);
                if (section === 'employees') return item.full_name?.toLowerCase().includes(search);
                if (section === 'orders') return item.order_number?.toLowerCase().includes(search);
                if (section === 'subjects') return item.name?.toLowerCase().includes(search);
                if (section === 'journal') {
                    const st = allData.students.find(s => s.id === item.student_id);
                    const su = allData.subjects.find(s => s.id === item.subject_id);
                    return (st?.full_name || '').toLowerCase().includes(search) ||
                           (su?.name || '').toLowerCase().includes(search);
                }
                return false;
            });
        }

        function filterAndRender() {
            const section = currentSection;
            const filtered = getFilteredData(section);
            renderTable(section, filtered);
            renderPagination(section, filtered.length);
        }

        function renderTable(section, data) {
            const tbody = document.getElementById(section + 'Table');
            if (!tbody) return;

            const start = (currentPage - 1) * pageSize;
            const paginated = data.slice(start, start + pageSize);

            let html = '';

            if (section === 'students') {
                html = paginated.map(s => `
                    <tr>
                        <td class="px-6 py-4">${s.full_name}</td>
                        <td class="px-6 py-4">${s.group_id || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('students', ${s.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('students', ${s.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (section === 'groups') {
                html = paginated.map(g => `
                    <tr>
                        <td class="px-6 py-4">${g.name}</td>
                        <td class="px-6 py-4">${g.speciality || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('groups', ${g.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('groups', ${g.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (section === 'employees') {
                html = paginated.map(e => `
                    <tr>
                        <td class="px-6 py-4">${e.full_name}</td>
                        <td class="px-6 py-4">${e.position || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('employees', ${e.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('employees', ${e.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (section === 'orders') {
                html = paginated.map(o => `
                    <tr>
                        <td class="px-6 py-4">${o.order_number}</td>
                        <td class="px-6 py-4">${o.order_date || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('orders', ${o.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('orders', ${o.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (section === 'subjects') {
                html = paginated.map(s => `
                    <tr>
                        <td class="px-6 py-4">${s.name}</td>
                        <td class="px-6 py-4">${s.hours || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('subjects', ${s.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('subjects', ${s.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');
            } else if (section === 'journal') {
                html = paginated.map(a => {
                    const st = allData.students.find(s => s.id === a.student_id);
                    const su = allData.subjects.find(s => s.id === a.subject_id);
                    return `
                    <tr>
                        <td class="px-6 py-4">${st?.full_name || '—'}</td>
                        <td class="px-6 py-4">${su?.name || '—'}</td>
                        <td class="px-6 py-4 font-semibold">${a.grade || '—'}</td>
                        <td class="px-6 py-4">${a.date || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('journal', ${a.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('journal', ${a.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
                }).join('');
            }

            tbody.innerHTML = html;
        }

        function renderPagination(section, totalItems) {
            const container = document.getElementById(section + 'Pagination');
            if (!container) return;
            container.innerHTML = '';

            const totalPages = Math.ceil(totalItems / pageSize);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 rounded-lg border text-sm ${currentPage === i ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-100'}`;
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    filterAndRender();
                };
                container.appendChild(btn);
            }
        }

        async function deleteItem(section, id) {
            if (!confirm('Удалить запись?')) return;
            try {
                const res = await fetch(`${API}/${section}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                showToast('Запись удалена');
                currentPage = 1;
                if (section === 'journal') await loadJournal();
                else await loadData(section);
            } catch {
                showToast('Ошибка при удалении', 'error');
            }
        }

        async function editItem(section, id) {
            editId = id;
            try {
                const res = await fetch(`${API}/${section}/${id}`);
                const data = await res.json();
                openModal(true, section, data);
            } catch {
                showToast('Не удалось загрузить данные', 'error');
            }
        }

        function openModal(isEdit = false, section = null, data = null) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            const sec = section || currentSection;

            document.getElementById('modalTitle').innerText = isEdit ? 'Редактировать' : 'Добавить';

            let html = '';

            if (sec === 'students') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="full_name" placeholder="ФИО" value="${data?.full_name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="number" id="group_id" placeholder="ID группы" value="${data?.group_id || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'groups') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="name" placeholder="Название группы" value="${data?.name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="text" id="speciality" placeholder="Специальность" value="${data?.speciality || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'employees') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="full_name" placeholder="ФИО" value="${data?.full_name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="text" id="position" placeholder="Должность" value="${data?.position || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'orders') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="order_number" placeholder="Номер приказа" value="${data?.order_number || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="date" id="order_date" value="${data?.order_date || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'subjects') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="name" placeholder="Название предмета" value="${data?.name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="number" id="hours" placeholder="Часы" value="${data?.hours || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'journal') {
                html = `
                    <form id="modalForm">
                        <input type="number" id="student_id" placeholder="ID студента" value="${data?.student_id || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="number" id="subject_id" placeholder="ID предмета" value="${data?.subject_id || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="number" id="grade" placeholder="Оценка (2-5)" min="2" max="5" value="${data?.grade || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="date" id="date" value="${data?.date || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            }

            content.innerHTML = html;

            document.getElementById('modalForm').onsubmit = async (e) => {
                e.preventDefault();
                const form = e.target;
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Сохранение...';

                let payload = {};
                const sec = currentSection;

                if (sec === 'students') payload = { full_name: form.full_name.value, group_id: form.group_id.value || null };
                else if (sec === 'groups') payload = { name: form.name.value, speciality: form.speciality.value || null };
                else if (sec === 'employees') payload = { full_name: form.full_name.value, position: form.position.value || null };
                else if (sec === 'orders') payload = { order_number: form.order_number.value, order_date: form.order_date.value || null };
                else if (sec === 'subjects') payload = { name: form.name.value, hours: form.hours.value || null };
                else if (sec === 'journal') {
                    const grade = parseInt(form.grade.value);
                    if (grade < 2 || grade > 5) {
                        showToast('Оценка должна быть от 2 до 5', 'error');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Сохранить';
                        return;
                    }
                    payload = {
                        student_id: parseInt(form.student_id.value),
                        subject_id: parseInt(form.subject_id.value),
                        grade: grade,
                        date: form.date.value || null
                    };
                }

                try {
                    const method = editId ? 'PUT' : 'POST';
                    const url = editId ? `${API}/${sec}/${editId}` : `${API}/${sec}/`;
                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error();
                    showToast('Данные сохранены');
                    closeModal();
                    currentPage = 1;
                    if (sec === 'journal') await loadJournal();
                    else await loadData(sec);
                } catch {
                    showToast('Ошибка при сохранении', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Сохранить';
                }
            };
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            editId = null;
        }

        window.onload = () => {
            showSection('students');
        };
    </script>
</body>
</html>
