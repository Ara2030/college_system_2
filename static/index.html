<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИС Колледжа • СПО</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-blue-600">ИС Колледжа</h1>
            </div>
            <nav class="px-3 text-sm">
                <a onclick="showSection('students')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-users w-5"></i> <span>Студенты</span></a>
                <a onclick="showSection('groups')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-layer-group w-5"></i> <span>Группы</span></a>
                <a onclick="showSection('employees')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-user-tie w-5"></i> <span>Сотрудники</span></a>
                <a onclick="showSection('orders')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-file-alt w-5"></i> <span>Приказы</span></a>
                <a onclick="showSection('subjects')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-book w-5"></i> <span>Предметы</span></a>
                <a onclick="showSection('journal')" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 cursor-pointer mb-1"><i class="fas fa-book-open w-5"></i> <span>Журнал оценок</span></a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="bg-white border-b px-8 py-5 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <h2 id="pageTitle" class="text-2xl font-semibold">Студенты</h2>
                    <div id="viewToggle" class="hidden bg-gray-100 rounded-xl p-1">
                        <button onclick="switchView('table')" id="btnTable"
                                class="px-4 py-1.5 text-sm rounded-lg bg-white shadow font-medium">Таблица</button>
                        <button onclick="switchView('cards')" id="btnCards"
                                class="px-4 py-1.5 text-sm rounded-lg hover:bg-white font-medium">Карточки</button>
                    </div>
                </div>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2">
                    <i class="fas fa-plus"></i>
                    <span id="addButtonText">Добавить</span>
                </button>
            </div>

            <div class="p-8">
                <!-- Search -->
                <div class="mb-4">
                    <div class="relative w-80">
                        <input type="text" id="searchInput" placeholder="Поиск..." 
                               class="w-full border px-4 py-2.5 pl-10 rounded-xl"
                               onkeyup="filterAndRender()">
                        <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                    </div>
                </div>

                <!-- Студенты -->
                <div id="students" class="section">
                    <div id="studentsTableContainer">
                        <div class="bg-white rounded-2xl shadow border overflow-hidden">
                            <table class="w-full">
                                <thead class="bg-gray-50"><tr>
                                    <th class="px-6 py-4 text-left">ФИО</th>
                                    <th class="px-6 py-4 text-left">Группа</th>
                                    <th class="px-6 py-4 w-28 text-center">Действия</th>
                                </tr></thead>
                                <tbody id="studentsTable" class="divide-y"></tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div id="studentsCardsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    <div id="studentsPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <!-- Сотрудники -->
                <div id="employees" class="section hidden">
                    <div id="employeesTableContainer">
                        <div class="bg-white rounded-2xl shadow border overflow-hidden">
                            <table class="w-full">
                                <thead class="bg-gray-50"><tr>
                                    <th class="px-6 py-4 text-left">ФИО</th>
                                    <th class="px-6 py-4 text-left">Должность</th>
                                    <th class="px-6 py-4 w-28 text-center">Действия</th>
                                </tr></thead>
                                <tbody id="employeesTable" class="divide-y"></tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div id="employeesCardsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                    <div id="employeesPagination" class="flex justify-center mt-4 gap-2"></div>
                </div>

                <!-- Остальные разделы -->
                <div id="groups" class="section hidden">...</div>
                <div id="orders" class="section hidden">...</div>
                <div id="subjects" class="section hidden">...</div>
                <div id="journal" class="section hidden">...</div>
            </div>
        </div>
    </div>

    <!-- Modal (для создания/редактирования) -->
    <div id="modal" onclick="if (event.target.id === 'modal') closeModal()" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="bg-white rounded-2xl w-full max-w-md mx-4 p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modalTitle" class="text-xl font-semibold"></h3>
                <button onclick="closeModal()"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" onclick="if (event.target.id === 'detailModal') closeDetailModal()" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div onclick="event.stopImmediatePropagation()" class="bg-white rounded-2xl w-full max-w-lg mx-4 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="detailModalTitle" class="text-xl font-semibold"></h3>
                <button onclick="closeDetailModal()"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="detailModalContent" class="space-y-3"></div>
            <div class="mt-6 flex gap-3">
                <button onclick="editFromDetail()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl">Редактировать</button>
                <button onclick="closeDetailModal()" class="flex-1 border py-2.5 rounded-xl">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastContainer" class="fixed bottom-5 right-5 flex flex-col gap-2 z-50"></div>

    <script>
        const API = "http://127.0.0.1:8000";
        let currentSection = 'students';
        let editId = null;
        let allData = { students: [], groups: [], employees: [], orders: [], subjects: [], journal: [] };
        let currentPage = 1;
        const pageSize = 10;
        let currentView = 'table';
        let currentDetailId = null;

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-5 py-3 rounded-xl shadow text-white flex items-center gap-3 ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.transition = 'all 0.3s'; toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
            document.getElementById(section).classList.remove('hidden');
            currentSection = section;
            currentPage = 1;
            editId = null;
            document.getElementById('searchInput').value = '';

            const titles = { students: 'Студенты', groups: 'Группы', employees: 'Сотрудники', orders: 'Приказы', subjects: 'Предметы', journal: 'Журнал оценок' };
            const addTexts = { students: 'Добавить студента', groups: 'Добавить группу', employees: 'Добавить сотрудника', orders: 'Добавить приказ', subjects: 'Добавить предмет', journal: 'Добавить оценку' };

            document.getElementById('pageTitle').innerText = titles[section];
            document.getElementById('addButtonText').innerText = addTexts[section];
            document.getElementById('viewToggle').classList.toggle('hidden', section !== 'students' && section !== 'employees');

            if (section === 'journal') loadJournal();
            else loadData(section);
        }

        function switchView(view) {
            currentView = view;
            document.getElementById('btnTable').classList.toggle('bg-white', view === 'table');
            document.getElementById('btnTable').classList.toggle('shadow', view === 'table');
            document.getElementById('btnCards').classList.toggle('bg-white', view === 'cards');
            document.getElementById('btnCards').classList.toggle('shadow', view === 'cards');

            if (currentSection === 'students') {
                document.getElementById('studentsTableContainer').classList.toggle('hidden', view === 'cards');
                document.getElementById('studentsCardsContainer').classList.toggle('hidden', view === 'table');
            }
            if (currentSection === 'employees') {
                document.getElementById('employeesTableContainer').classList.toggle('hidden', view === 'cards');
                document.getElementById('employeesCardsContainer').classList.toggle('hidden', view === 'table');
            }
            filterAndRender();
        }

        async function loadData(section) {
            try {
                const res = await fetch(`${API}/${section}/`);
                if (!res.ok) throw new Error();
                allData[section] = await res.json();
                filterAndRender();
            } catch {
                showToast('Ошибка загрузки данных', 'error');
            }
        }

        async function loadJournal() {
            try {
                const [s, sub, att] = await Promise.all([fetch(`${API}/students/`), fetch(`${API}/subjects/`), fetch(`${API}/attestation/`)]);
                allData.students = await s.json();
                allData.subjects = await sub.json();
                allData.journal = await att.json();
                filterAndRender();
            } catch {
                showToast('Ошибка загрузки журнала', 'error');
            }
        }

        function getFilteredData(section) {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            let data = allData[section] || [];
            if (!search) return data;
            return data.filter(item => {
                if (section === 'students' || section === 'employees') return item.full_name?.toLowerCase().includes(search);
                if (section === 'groups' || section === 'subjects') return item.name?.toLowerCase().includes(search);
                if (section === 'orders') return item.order_number?.toLowerCase().includes(search);
                return false;
            });
        }

        function filterAndRender() {
            const section = currentSection;
            const filtered = getFilteredData(section);
            renderTable(section, filtered);
            renderPagination(section, filtered.length);
        }

        function renderTable(section, data) {
            const start = (currentPage - 1) * pageSize;
            const paginated = data.slice(start, start + pageSize);

            if (section === 'students') {
                // Таблица
                const tbody = document.getElementById('studentsTable');
                tbody.innerHTML = paginated.map(s => `
                    <tr>
                        <td class="px-6 py-4">${s.full_name}</td>
                        <td class="px-6 py-4">${s.group_id || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('students', ${s.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('students', ${s.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');

                // Карточки
                const cardsContainer = document.getElementById('studentsCardsContainer');
                cardsContainer.innerHTML = paginated.map(s => `
                    <div onclick="showStudentDetail(${s.id})" class="bg-white border rounded-2xl p-5 cursor-pointer hover:shadow-md transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-semibold text-lg">${s.full_name}</div>
                                <div class="text-sm text-gray-500 mt-1">Группа: ${s.group_id || '—'}</div>
                            </div>
                            <button onclick="event.stopImmediatePropagation(); editItem('students', ${s.id})" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                        <div class="mt-4 space-y-1 text-sm text-gray-600">
                            <div><i class="fas fa-phone w-4"></i> ${s.phone || '—'}</div>
                            <div><i class="fas fa-envelope w-4"></i> ${s.email || '—'}</div>
                            <div><i class="fas fa-calendar w-4"></i> Поступил: ${s.enrollment_date || '—'}</div>
                        </div>
                    </div>
                `).join('');
            }

            if (section === 'employees') {
                const tbody = document.getElementById('employeesTable');
                tbody.innerHTML = paginated.map(e => `
                    <tr>
                        <td class="px-6 py-4">${e.full_name}</td>
                        <td class="px-6 py-4">${e.position || '—'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="editItem('employees', ${e.id})" class="text-blue-600 mx-1"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteItem('employees', ${e.id})" class="text-red-600 mx-1"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`).join('');

                const cardsContainer = document.getElementById('employeesCardsContainer');
                cardsContainer.innerHTML = paginated.map(e => `
                    <div onclick="showEmployeeDetail(${e.id})" class="bg-white border rounded-2xl p-5 cursor-pointer hover:shadow-md transition">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-semibold text-lg">${e.full_name}</div>
                                <div class="text-sm text-gray-500 mt-1">${e.position || '—'}</div>
                            </div>
                            <button onclick="event.stopImmediatePropagation(); editItem('employees', ${e.id})" class="text-blue-600 hover:text-blue-800">
                                <i class="fas fa-edit"></i>
                            </button>
                        </div>
                        <div class="mt-4 space-y-1 text-sm text-gray-600">
                            <div><i class="fas fa-building w-4"></i> ${e.department || '—'}</div>
                            <div><i class="fas fa-phone w-4"></i> ${e.phone || '—'}</div>
                            <div><i class="fas fa-envelope w-4"></i> ${e.email || '—'}</div>
                            <div><i class="fas fa-calendar w-4"></i> С: ${e.employment_date || '—'}</div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function renderPagination(section, totalItems) {
            const container = document.getElementById(section + 'Pagination');
            if (!container) return;
            container.innerHTML = '';
            const totalPages = Math.ceil(totalItems / pageSize);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `px-3 py-1 rounded-lg border text-sm ${currentPage === i ? 'bg-blue-600 text-white' : 'bg-white hover:bg-gray-100'}`;
                btn.textContent = i;
                btn.onclick = () => { currentPage = i; filterAndRender(); };
                container.appendChild(btn);
            }
        }

        // Детальная информация
        function showStudentDetail(id) {
            const student = allData.students.find(s => s.id === id);
            if (!student) return;
            currentDetailId = id;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailModalContent');
            document.getElementById('detailModalTitle').innerText = student.full_name;

            content.innerHTML = `
                <div><span class="font-medium">ФИО:</span> ${student.full_name}</div>
                <div><span class="font-medium">Группа:</span> ${student.group_id || '—'}</div>
                <div><span class="font-medium">Телефон:</span> ${student.phone || '—'}</div>
                <div><span class="font-medium">Email:</span> ${student.email || '—'}</div>
                <div><span class="font-medium">Дата поступления:</span> ${student.enrollment_date || '—'}</div>
            `;
            modal.classList.remove('hidden');
        }

        function showEmployeeDetail(id) {
            const employee = allData.employees.find(e => e.id === id);
            if (!employee) return;
            currentDetailId = id;

            const modal = document.getElementById('detailModal');
            const content = document.getElementById('detailModalContent');
            document.getElementById('detailModalTitle').innerText = employee.full_name;

            content.innerHTML = `
                <div><span class="font-medium">ФИО:</span> ${employee.full_name}</div>
                <div><span class="font-medium">Должность:</span> ${employee.position || '—'}</div>
                <div><span class="font-medium">Отдел:</span> ${employee.department || '—'}</div>
                <div><span class="font-medium">Телефон:</span> ${employee.phone || '—'}</div>
                <div><span class="font-medium">Email:</span> ${employee.email || '—'}</div>
                <div><span class="font-medium">Дата трудоустройства:</span> ${employee.employment_date || '—'}</div>
            `;
            modal.classList.remove('hidden');
        }

        function editFromDetail() {
            closeDetailModal();
            if (currentSection === 'students') {
                editItem('students', currentDetailId);
            } else if (currentSection === 'employees') {
                editItem('employees', currentDetailId);
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // CRUD функции
        async function deleteItem(section, id) {
            if (!confirm('Удалить запись?')) return;
            try {
                const res = await fetch(`${API}/${section}/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error();
                showToast('Запись удалена');
                currentPage = 1;
                await loadData(section);
            } catch {
                showToast('Ошибка при удалении', 'error');
            }
        }

        async function editItem(section, id) {
            editId = id;
            try {
                const res = await fetch(`${API}/${section}/${id}`);
                const data = await res.json();
                openModal(true, section, data);
            } catch {
                showToast('Не удалось загрузить данные', 'error');
            }
        }

        function openModal(isEdit = false, section = null, data = null) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            const sec = section || currentSection;

            document.getElementById('modalTitle').innerText = isEdit ? 'Редактировать' : 'Добавить';

            let html = '';

            if (sec === 'students') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="full_name" placeholder="ФИО" value="${data?.full_name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="number" id="group_id" placeholder="ID группы" value="${data?.group_id || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="text" id="phone" placeholder="Телефон" value="${data?.phone || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="email" id="email" placeholder="Email" value="${data?.email || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="date" id="enrollment_date" value="${data?.enrollment_date || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            } else if (sec === 'employees') {
                html = `
                    <form id="modalForm">
                        <input type="text" id="full_name" placeholder="ФИО" value="${data?.full_name || ''}" class="w-full border p-3 rounded-xl mb-3" required>
                        <input type="text" id="position" placeholder="Должность" value="${data?.position || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="text" id="department" placeholder="Отдел" value="${data?.department || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="text" id="phone" placeholder="Телефон" value="${data?.phone || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="email" id="email" placeholder="Email" value="${data?.email || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <input type="date" id="employment_date" value="${data?.employment_date || ''}" class="w-full border p-3 rounded-xl mb-3">
                        <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl">Сохранить</button>
                    </form>`;
            }

            content.innerHTML = html;

            document.getElementById('modalForm').onsubmit = async (e) => {
                e.preventDefault();
                const form = e.target;
                const submitBtn = form.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Сохранение...';

                let payload = {};
                if (sec === 'students') {
                    payload = {
                        full_name: form.full_name.value,
                        group_id: form.group_id.value || null,
                        phone: form.phone.value || null,
                        email: form.email.value || null,
                        enrollment_date: form.enrollment_date.value || null
                    };
                } else if (sec === 'employees') {
                    payload = {
                        full_name: form.full_name.value,
                        position: form.position.value || null,
                        department: form.department.value || null,
                        phone: form.phone.value || null,
                        email: form.email.value || null,
                        employment_date: form.employment_date.value || null
                    };
                }

                try {
                    const method = editId ? 'PUT' : 'POST';
                    const url = editId ? `${API}/${sec}/${editId}` : `${API}/${sec}/`;
                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error();
                    showToast('Данные сохранены');
                    closeModal();
                    currentPage = 1;
                    await loadData(sec);
                } catch {
                    showToast('Ошибка при сохранении', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Сохранить';
                }
            };
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            editId = null;
        }

        window.onload = () => {
            showSection('students');
        };
    </script>
</body>
</html>
